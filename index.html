<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chef Perso</title>

    <!-- 📱 OPTIONS PLEIN ÉCRAN PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Chef Perso">
    <meta name="theme-color" content="#f8fafc">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1830/1830839.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      button, input, select { touch-action: manipulation; }
      .input-error { border-color: #ef4444 !important; border-width: 2px !important; }
      * { word-wrap: break-word; }
      body {
        padding-top: env(safe-area-inset-top, 8px);
        padding-bottom: env(safe-area-inset-bottom, 8px);
      }
    </style>
  </head>
  <body class="bg-slate-100 p-3 sm:p-4 min-h-screen text-slate-800 font-sans w-full overflow-x-hidden box-border">
    
    <!-- MENU PRINCIPAL (NOUVELLE ERGONOMIE DASHBOARD) -->
    <div id="menu_principal" class="etape flex flex-col gap-4 w-full max-w-md mx-auto">
      
      <!-- En-tête Application -->
      <div class="flex items-center justify-between pt-2 pb-1">
        <div>
          <h1 class="text-2xl font-black text-slate-800 tracking-tight">Chef Perso</h1>
          <p class="text-xs text-slate-500 font-medium">Planification & Courses intelligentes</p>
        </div>
        <div class="w-10 h-10 rounded-2xl bg-blue-500 text-white flex items-center justify-center font-bold text-xl shadow-md">
          🍳
        </div>
      </div>

      <!-- Action Principale (CTA) -->
      <button type="button" onclick="ouvrirPlanification()" class="w-full p-5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-3xl shadow-lg shadow-blue-500/20 flex items-center justify-between active:scale-[0.98] transition-all">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-2xl bg-white/20 flex items-center justify-center text-2xl backdrop-blur-sm">
            🛒
          </div>
          <div class="text-left">
            <span class="block text-lg font-bold leading-tight">Créer un menu</span>
            <span class="text-xs text-blue-100 font-medium">Planifier repas & courses</span>
          </div>
        </div>
        <span class="text-xl font-bold bg-white/20 w-8 h-8 rounded-full flex items-center justify-center">➔</span>
      </button>

      <!-- Grille d'actions secondaires -->
      <div class="grid grid-cols-2 gap-3 mt-1">
        
        <button type="button" onclick="chargerMenus()" class="p-4 bg-white rounded-2xl shadow-sm border border-slate-200/80 flex flex-col gap-3 text-left active:bg-slate-50 active:scale-[0.98] transition-all">
          <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl font-bold">
            📅
          </div>
          <div>
            <span class="block font-bold text-slate-800 text-sm">Mes Menus</span>
            <span class="text-[11px] text-slate-400">Voir l'historique</span>
          </div>
        </button>

        <button type="button" onclick="changerVue('vue_consult')" class="p-4 bg-white rounded-2xl shadow-sm border border-slate-200/80 flex flex-col gap-3 text-left active:bg-slate-50 active:scale-[0.98] transition-all">
          <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl font-bold">
            📖
          </div>
          <div>
            <span class="block font-bold text-slate-800 text-sm">Fiche Recette</span>
            <span class="text-[11px] text-slate-400">Consulter & cuisiner</span>
          </div>
        </button>

      </div>

      <!-- Action Gestion Base -->
      <button type="button" onclick="changerVue('vue_ajout')" class="w-full p-3.5 bg-white rounded-2xl shadow-sm border border-slate-200/80 flex items-center justify-between px-4 active:bg-slate-50 active:scale-[0.98] transition-all mt-1">
        <div class="flex items-center gap-3">
          <span class="text-lg">➕</span>
          <span class="font-bold text-slate-700 text-sm">Ajouter une nouvelle recette</span>
        </div>
        <span class="text-slate-400 text-sm">➔</span>
      </button>

    </div>

    <!-- MES MENUS PLANIFIÉS -->
    <div id="vue_menus" class="etape hidden flex flex-col gap-3 w-full max-w-md mx-auto">
      <button type="button" onclick="changerVue('menu_principal')" class="text-slate-500 font-bold py-2 text-left w-fit">⬅ Accueil</button>
      <h2 class="text-xl font-bold text-indigo-700 text-center mb-2">Mes Menus Planifiés</h2>
      <div id="conteneur_menus" class="flex flex-col gap-5">
        <p class="text-center text-slate-500 animate-pulse">Chargement de tes menus...</p>
      </div>
    </div>

    <!-- ÉTAPE CREATION / EDITION DE MENU -->
    <div id="etape2" class="etape hidden flex flex-col gap-3 w-full max-w-md mx-auto">
      <button type="button" onclick="changerVue('menu_principal')" class="text-slate-500 font-bold py-1 text-left w-fit">⬅ Accueil</button>
      <h2 id="titre_edition_menu" class="text-xl font-bold text-center text-slate-700 mt-1 mb-1">Composer le menu</h2>
      
      <!-- ID caché pour la modification -->
      <input type="hidden" id="edit_menu_id" value="">

      <!-- Sélection du premier jour de la semaine du menu -->
      <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200">
        <label class="block font-semibold text-slate-600 mb-1 text-xs uppercase tracking-wider">Premier jour de la semaine (Lundi) :</label>
        <input type="date" id="date_debut_menu" 
               class="w-full h-11 text-base px-3 border border-slate-300 rounded-xl bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
      </div>

      <!-- Conteneur des blocs repas -->
      <div id="form_repas" class="flex flex-col gap-4"></div>
      
      <!-- Bouton Ajouter un repas au menu -->
      <button type="button" onclick="ajouterBlocRepas()" 
              class="w-full min-h-[50px] bg-blue-50 text-blue-700 font-bold text-base rounded-2xl border-2 border-dashed border-blue-300 active:bg-blue-100 transition-all flex items-center justify-center gap-2">
        <span>➕</span> Ajouter un repas
      </button>

      <p id="msg_erreur" class="text-red-500 font-bold text-sm text-center hidden">⚠️ N'oublie pas de choisir une recette pour chaque repas !</p>

      <div class="flex gap-2 mt-2">
        <button type="button" onclick="calcul()" 
                class="w-full min-h-[52px] bg-blue-500 text-white font-bold text-base rounded-xl shadow-md active:bg-blue-600 active:scale-[0.98] transition-all">
          Générer & Sauvegarder le menu
        </button>
      </div>
    </div>

    <!-- LISTE DE COURSES DU MENU (TRIÉE PAR RAYON) -->
    <div id="etape3" class="etape hidden flex flex-col gap-3 w-full max-w-md mx-auto">
      <h2 class="text-xl font-bold text-center text-slate-700 mt-2 mb-1">🛒 Ma liste de courses</h2>
      
      <div class="bg-white p-2 rounded-2xl shadow-sm border border-slate-200 flex gap-2 items-center">
        <input type="text" id="ajout_manuel" placeholder="Ajouter un article hors recette..." 
               class="flex-grow min-h-[44px] p-2 text-sm border border-slate-300 rounded-xl bg-slate-50 focus:outline-none focus:ring-2 focus:ring-green-500 transition-all">
        <button type="button" onclick="ajouterIngredient()" 
                class="min-w-[44px] min-h-[44px] w-11 bg-slate-200 text-slate-700 font-bold text-xl rounded-xl active:bg-slate-300 transition-all flex items-center justify-center">
          ➕
        </button>
      </div>

      <!-- Conteneur des rayons -->
      <div id="conteneur_rayons" class="flex flex-col gap-3 w-full"></div>
      
      <div class="flex gap-2 mt-2 w-full">
        <button type="button" onclick="partage('Menu')" class="w-1/2 min-h-[56px] bg-blue-500 text-white font-bold rounded-xl shadow-md active:bg-blue-600 active:scale-[0.98] transition-all flex flex-col items-center justify-center p-2">
          <span class="text-lg leading-none mb-1">🍽️</span>
          <span class="text-xs sm:text-sm">Partager le Menu</span>
        </button>
        <button type="button" onclick="partage('Courses')" class="w-1/2 min-h-[56px] bg-green-500 text-white font-bold rounded-xl shadow-md active:bg-green-600 active:scale-[0.98] transition-all flex flex-col items-center justify-center p-2">
          <span class="text-lg leading-none mb-1">🛒</span>
          <span class="text-xs sm:text-sm">Partager les Courses</span>
        </button>
      </div>

      <div class="flex gap-2 mt-1 w-full">
        <button type="button" onclick="changerVue('menu_principal')" class="w-full min-h-[50px] bg-slate-800 text-white font-bold text-base rounded-xl active:bg-slate-900 active:scale-[0.98] transition-all">
          Accueil principal
        </button>
      </div>
    </div>

    <!-- CUISINER (CONSULTATION FICHE RECETTE) -->
    <div id="vue_consult" class="etape hidden flex flex-col gap-3 w-full max-w-md mx-auto">
      <button type="button" onclick="changerVue('menu_principal')" class="text-slate-500 font-bold py-2 text-left w-fit">⬅ Accueil</button>
      <h2 class="text-xl font-bold text-emerald-700 text-center">Fiche recette</h2>
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3">
        <select id="select_consult" class="w-full h-12 border rounded-lg p-2 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-emerald-500" onchange="afficherDetails()"></select>
        <div class="flex items-center justify-between gap-4">
          <label class="font-bold text-sm text-slate-600">Nbr de parts :</label>
          <div class="flex items-center border border-slate-300 rounded-xl overflow-hidden bg-slate-50">
            <button type="button" onclick="modifierPartsConsult(-1)" class="w-10 h-10 bg-slate-200 text-slate-700 font-black text-lg active:bg-slate-300 transition-all flex items-center justify-center">−</button>
            <span id="parts_consult_val" class="w-12 text-center font-bold text-slate-800 text-base">5</span>
            <button type="button" onclick="modifierPartsConsult(1)" class="w-10 h-10 bg-slate-200 text-slate-700 font-black text-lg active:bg-slate-300 transition-all flex items-center justify-center">+</button>
          </div>
        </div>
      </div>
      <div id="details_recette" class="bg-white rounded-2xl shadow-sm border border-slate-200 min-h-[100px] overflow-hidden">
        <p class="p-4 text-center text-slate-400 italic text-sm">Sélectionnez une recette pour voir ses ingrédients.</p>
      </div>
    </div>

    <!-- AJOUTER UNE RECETTE -->
    <div id="vue_ajout" class="etape hidden flex flex-col gap-3 w-full max-w-md mx-auto">
      <button type="button" onclick="changerVue('menu_principal')" class="text-slate-500 font-bold py-2 text-left w-fit">⬅ Accueil</button>
      <h2 class="text-xl font-bold text-orange-600 text-center">Nouvelle Recette</h2>
      
      <input type="text" id="new_nom" placeholder="Titre de la recette..." class="h-14 border border-slate-300 rounded-xl px-4 font-bold shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-500">
      
      <div id="new_ingredients_list" class="flex flex-col gap-2"></div>
      
      <button type="button" onclick="addIngRow()" class="h-12 bg-orange-50 text-orange-700 font-bold rounded-xl border-2 border-dashed border-orange-300 active:bg-orange-100 transition-all">
        ➕ Ajouter un ingrédient
      </button>
      
      <button type="button" id="btn_save" onclick="sauverRecette()" class="h-14 bg-orange-500 text-white font-bold text-lg rounded-xl shadow-md mt-2 active:bg-orange-600 active:scale-[0.98] transition-all">
        💾 Enregistrer la recette
      </button>
    </div>

    <script>
      const API_URL = "https://script.google.com/macros/s/AKfycbySlDdnnMmzGoHjFNWW5wOaSX19E1prYj5DrFXZQg0H-jn_k-7RAsGSNmf_f-rqyCr3vg/exec";

      let recs = [], plan = [], menusCharges = [], listeCoursesBrute = [];

      // --- MAPPING TAXONOMIE DES RAYONS DE SUPERMARCHÉ ---
      const REGLES_RAYONS = [
        { rayon: "🥦 Fruits & Légumes", mots: ["pomme", "poivron", "oignon", "ail", "carotte", "courgette", "tomate", "salade", "avocat", "citron", "champignon", "haricot", "brocoli", "épinard", "patate", "pomme de terre", "persil", "ciboulette", "basilic", "concombre"] },
        { rayon: "🧀 Produits Frais & Crémerie", mots: ["lait", "beurre", "crème", "creme", "yaourt", "fromage", "emmental", "mozzarella", "parmesan", "feta", "œuf", "oeuf", "mascarpone", "ricotta", "comté"] },
        { rayon: "🥩 Boucherie & Poissonnerie", mots: ["poulet", "dinde", "boeuf", "bœuf", "porc", "jambon", "lardons", "saumon", "cabillaud", "crevette", "thon", "viande", "steak", "escalope", "saucisse"] },
        { rayon: "🍝 Épicerie Salée & Conserves", mots: ["riz", "pâte", "pate", "farine", "huile", "vinaigre", "sel", "poivre", "épice", "epice", "sauce", "moutarde", "lentille", "pois chiche", "pain", "tortilla", "bouillon", "sucre", "chocolat"] },
        { rayon: "❄️ Surgelés", mots: ["glace", "surgelé", "surgeles", "frite"] },
        { rayon: "🥤 Boissons", mots: ["eau", "jus", "soda", "vin", "bière", "café", "thé"] }
      ];

      function determinerRayon(nomIngredient) {
        const nom = nomIngredient.toLowerCase();
        for (let regle of REGLES_RAYONS) {
          if (regle.mots.some(m => nom.includes(m))) {
            return regle.rayon;
          }
        }
        return "🛒 Rayon Divers / Épicerie";
      }

      async function apiGet(action, params = {}) {
        const queryParams = new URLSearchParams({ action, ...params }).toString();
        const response = await fetch(`${API_URL}?${queryParams}`);
        return await response.json();
      }

      async function apiPost(action, data = {}) {
        const response = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action, ...data })
        });
        return await response.json();
      }

      document.addEventListener('DOMContentLoaded', async function() {
        const DELAI_EXPIRATION = 30 * 60 * 1000; 
        let dernierAcces = parseInt(localStorage.getItem('dernier_acces') || "0");
        let maintenant = new Date().getTime();
        let vueSauvegardee = 'menu_principal';

        if (maintenant - dernierAcces < DELAI_EXPIRATION) {
          vueSauvegardee = localStorage.getItem('derniere_vue') || 'menu_principal';
        } else {
          localStorage.setItem('derniere_vue', 'menu_principal');
        }

        localStorage.setItem('dernier_acces', maintenant.toString());
        changerVue(vueSauvegardee, false);

        try {
          recs = await apiGet('getListeRecettes') || [];
          if (vueSauvegardee === 'vue_menus') chargerMenus();
          if (vueSauvegardee === 'vue_consult') {
            let lastRecipe = localStorage.getItem('derniere_recette');
            if (lastRecipe) {
              setTimeout(() => cuisinerRaccourci(lastRecipe, localStorage.getItem('derniers_couverts') || 5), 300);
            }
          }
        } catch(e) {
          console.error('Erreur de connexion API');
        }
      });

      function getProchainLundi() {
        let d = new Date();
        let day = d.getDay();
        let diff = d.getDate() - day + (day === 0 ? -6 : 1);
        let lundi = new Date(d.setDate(diff));
        return lundi.toISOString().split('T')[0];
      }

      function ouvrirPlanification() {
        document.getElementById('edit_menu_id').value = '';
        document.getElementById('titre_edition_menu').innerText = 'Composer le menu';
        document.getElementById('date_debut_menu').value = getProchainLundi();
        document.getElementById('form_repas').innerHTML = '';
        ajouterBlocRepas();
        changerVue('etape2');
      }

      function changerVue(id, sauver = true) {
        document.querySelectorAll('.etape').forEach(e => e.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        
        localStorage.setItem('dernier_acces', new Date().getTime().toString());
        if (sauver) {
          localStorage.setItem('derniere_vue', id);
        }
        
        if(id === 'vue_consult') {
          let optionsSafe = (recs || []).map(r => `<option value="${String(r).replace(/"/g, '&quot;')}">${String(r)}</option>`).join('');
          let currentSelect = document.getElementById('select_consult').value;
          document.getElementById('select_consult').innerHTML = '<option value="">Sélectionner une recette...</option>' + optionsSafe;
          if (currentSelect) document.getElementById('select_consult').value = currentSelect;
        }
      }

      function ajouterBlocRepas(donneesRepas = null) {
        const conteneur = document.getElementById('form_repas');
        const optionsHTML = '<option value="">Sélectionne une recette</option>' + (recs || []).map(r => `<option value="${String(r).replace(/"/g, '&quot;')}">${String(r)}</option>`).join('');

        const joursData = [
          { label: 'Lu', val: 'lundi' }, { label: 'Ma', val: 'mardi' }, { label: 'Me', val: 'mercredi' },
          { label: 'Je', val: 'jeudi' }, { label: 'Ve', val: 'vendredi' }, { label: 'Sa', val: 'samedi' }, { label: 'Di', val: 'dimanche' }
        ];

        let gridHTML = '<div class="grid grid-cols-7 gap-1 mt-3 mb-2">';
        joursData.forEach(j => {
          gridHTML += `
            <div class="flex flex-col gap-1 items-center">
              <span class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">${j.label}</span>
              <button type="button" class="slot-btn w-full aspect-square min-h-[40px] rounded-lg bg-slate-100 text-slate-400 text-base border border-slate-200 active:scale-90 transition-all flex items-center justify-center" data-val="${j.val} midi" onclick="toggleSlot(this)">☀️</button>
              <button type="button" class="slot-btn w-full aspect-square min-h-[40px] rounded-lg bg-slate-100 text-slate-400 text-base border border-slate-200 active:scale-90 transition-all flex items-center justify-center" data-val="${j.val} soir" onclick="toggleSlot(this)">🌙</button>
            </div>`;
        });
        gridHTML += '</div>';

        let cardIndex = conteneur.children.length + 1;
        let cardHTML = `
          <div class="repas-card bg-white p-4 rounded-2xl shadow-sm border border-slate-200 border-l-4 border-l-blue-500 flex flex-col gap-2 relative">
            ${cardIndex > 1 ? `<button type="button" onclick="this.closest('.repas-card').remove()" class="absolute top-2 right-2 w-8 h-8 text-slate-400 hover:text-red-500 flex items-center justify-center text-sm font-bold">✕</button>` : ''}
            <div class="flex flex-col mb-1 border-b border-dashed border-slate-200 pb-2">
              <span class="titre-display text-base font-bold text-slate-400 leading-tight">Sélectionne les créneaux 👇</span>
              <input type="hidden" class="titre" value="Repas non défini">
            </div>
            ${gridHTML}
            
            <div class="flex items-center justify-between gap-2 mt-2">
              <label class="font-semibold text-slate-600 text-xs whitespace-nowrap">Nbr de parts :</label>
              <div class="flex items-center border border-slate-300 rounded-xl overflow-hidden bg-slate-50">
                <button type="button" onclick="modifierPartsCard(this, -1)" class="w-10 h-10 bg-slate-200 text-slate-700 font-black text-lg active:bg-slate-300 transition-all flex items-center justify-center">−</button>
                <span class="couverts-val w-12 text-center font-bold text-slate-800 text-sm">5</span>
                <input type="hidden" class="couverts" value="5">
                <button type="button" onclick="modifierPartsCard(this, 1)" class="w-10 h-10 bg-slate-200 text-slate-700 font-black text-lg active:bg-slate-300 transition-all flex items-center justify-center">+</button>
              </div>
            </div>

            <select class="recette w-full min-h-[44px] text-sm p-2 mt-1 border border-slate-300 rounded-xl bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
              ${optionsHTML}
            </select>
          </div>`;

        conteneur.insertAdjacentHTML('beforeend', cardHTML);

        if (donneesRepas) {
          let derniereCard = conteneur.lastElementChild;
          if (donneesRepas.recette) derniereCard.querySelector('.recette').value = donneesRepas.recette;
          if (donneesRepas.couverts) {
            derniereCard.querySelector('.couverts').value = donneesRepas.couverts;
            derniereCard.querySelector('.couverts-val').innerText = donneesRepas.couverts;
          }
          if (donneesRepas.titre) {
            let slotsFormates = donneesRepas.titre.toLowerCase();
            derniereCard.querySelectorAll('.slot-btn').forEach(btn => {
              let val = btn.getAttribute('data-val');
              if (slotsFormates.includes(val)) {
                toggleSlot(btn);
              }
            });
          }
        }
      }

      function modifierPartsCard(btn, delta) {
        let parent = btn.closest('div');
        let valSpan = parent.querySelector('.couverts-val');
        let inputHidden = parent.querySelector('.couverts');
        let valActuelle = parseInt(inputHidden.value) || 5;
        let nouvelleVal = Math.max(1, valActuelle + delta);
        valSpan.innerText = nouvelleVal;
        inputHidden.value = nouvelleVal;
      }

      function modifierPartsConsult(delta) {
        let valSpan = document.getElementById('parts_consult_val');
        let valActuelle = parseInt(valSpan.innerText) || 5;
        let nouvelleVal = Math.max(1, valActuelle + delta);
        valSpan.innerText = nouvelleVal;
        afficherDetails();
      }

      function toggleSlot(btn) {
        btn.classList.toggle('bg-blue-100');
        btn.classList.toggle('border-blue-400');
        btn.classList.toggle('bg-slate-100');
        btn.classList.toggle('border-slate-200');
        
        let card = btn.closest('.repas-card');
        let actives = card.querySelectorAll('.slot-btn.bg-blue-100');
        let titleDisplay = card.querySelector('.titre-display');
        let titleInput = card.querySelector('.titre');
        
        if (actives.length > 0) {
            let slotsArr = Array.from(actives).map(b => b.getAttribute('data-val'));
            let slotsFormates = "";
            
            if (slotsArr.length === 1) {
              slotsFormates = slotsArr[0];
            } else {
              let dernier = slotsArr.pop();
              slotsFormates = slotsArr.join(', ') + ' et ' + dernier;
            }

            slotsFormates = slotsFormates.charAt(0).toUpperCase() + slotsFormates.slice(1);
            titleDisplay.innerText = slotsFormates;
            titleInput.value = slotsFormates;
            titleDisplay.classList.remove('text-slate-400');
            titleDisplay.classList.add('text-blue-700');
        } else {
            titleDisplay.innerText = "Sélectionne les créneaux 👇";
            titleInput.value = "Repas non défini";
            titleDisplay.classList.add('text-slate-400');
            titleDisplay.classList.remove('text-blue-700');
        }
      }

      async function chargerMenus() {
        changerVue('vue_menus');
        document.getElementById('conteneur_menus').innerHTML = '<p class="text-center text-slate-500 animate-pulse mt-4">Chargement...</p>';
        
        try {
          menusCharges = await apiGet('getMenusSauvegardes');
          let box = document.getElementById('conteneur_menus');
          if(!menusCharges || menusCharges.length === 0) {
            box.innerHTML = '<p class="text-center text-slate-500 mt-4">Aucun menu planifié.</p>';
            return;
          }

          const aujourdhui = new Date();
          aujourdhui.setHours(0,0,0,0);

          let html = '';
          menusCharges.forEach((lot, index) => {
            let titreBloc = "📅 Menu";
            let badgeColor = "border-slate-300";

            if (lot.dateDebut) {
              let debut = new Date(lot.dateDebut);
              let fin = new Date(lot.dateDebut);
              fin.setDate(fin.getDate() + 6);

              if (aujourdhui >= debut && aujourdhui <= fin) {
                titreBloc = "🟢 Menu de la semaine en cours";
                badgeColor = "border-emerald-500";
              } else if (aujourdhui < debut) {
                titreBloc = "🔵 Menu de la semaine prochaine";
                badgeColor = "border-blue-500";
              } else {
                titreBloc = "⚪ Menu passé";
                badgeColor = "border-slate-300";
              }
            } else {
              titreBloc = (index === 0) ? "🟢 Menu en cours" : "🔵 Menu suivant";
              badgeColor = (index === 0) ? "border-emerald-500" : "border-blue-500";
            }

            let dateAffichee = lot.dateDebut 
              ? "Semaine du " + new Date(lot.dateDebut).toLocaleDateString('fr-FR')
              : "Créé le " + lot.date;

            html += `<div class="bg-white p-4 rounded-2xl shadow-sm border-2 ${badgeColor}">
                      <div class="flex justify-between items-center border-b pb-2 mb-3">
                        <div>
                          <h3 class="font-black text-slate-700 text-sm">${titreBloc}</h3>
                          <span class="text-xs text-slate-400 font-medium">${dateAffichee}</span>
                        </div>
                        <button type="button" onclick="editerMenuExistant('${lot.id}')" class="bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-xl text-xs font-bold border border-indigo-200 active:scale-95 transition-all">✏️ Modifier</button>
                      </div>
                      <div class="flex flex-col gap-2">`;
            
            lot.repas.forEach(r => {
              let recSafe = String(r.recette).replace(/'/g, "\\'").replace(/"/g, '&quot;');
              html += `
                <div onclick="cuisinerRaccourci('${recSafe}', ${r.couverts})" class="bg-slate-50 p-3 rounded-xl border border-slate-100 active:bg-slate-100 active:scale-95 transition-all cursor-pointer">
                  <p class="font-bold text-indigo-700 text-sm mb-1">${r.titre}</p>
                  <p class="text-slate-600 text-sm flex justify-between items-center">
                    <span>🍲 ${r.recette} <span class="text-xs opacity-70">(${r.couverts} parts)</span></span>
                    <span class="text-xs bg-white border px-2 py-1 rounded-md shadow-sm">👉 Cuisiner</span>
                  </p>
                </div>`;
            });
            html += `</div></div>`;
          });
          box.innerHTML = html;
        } catch(e) {
          document.getElementById('conteneur_menus').innerHTML = '<p class="text-center text-red-500 mt-4">Erreur lors du chargement.</p>';
        }
      }

      function editerMenuExistant(idMenu) {
        let lot = menusCharges.find(m => String(m.id) === String(idMenu));
        if (!lot) return;

        document.getElementById('edit_menu_id').value = lot.id;
        document.getElementById('titre_edition_menu').innerText = 'Modifier le menu';
        if (lot.dateDebut) document.getElementById('date_debut_menu').value = lot.dateDebut;

        document.getElementById('form_repas').innerHTML = '';
        lot.repas.forEach(repas => {
          ajouterBlocRepas(repas);
        });

        changerVue('etape2');
      }

      function cuisinerRaccourci(recette, couverts) {
        localStorage.setItem('derniere_recette', recette);
        localStorage.setItem('derniers_couverts', couverts);
        changerVue('vue_consult');
        document.getElementById('select_consult').value = recette;
        document.getElementById('parts_consult_val').innerText = couverts;
        afficherDetails();
      }

      async function calcul() {
        let blocks = document.querySelectorAll('.repas-card');
        let err = false;
        plan = [];
        
        blocks.forEach(b => {
          let sel = b.querySelector('.recette');
          let couv = b.querySelector('.couverts');
          if(!sel || !sel.value) { 
            if(sel) sel.classList.add('input-error'); 
            err = true; 
          } else { 
            if(sel) sel.classList.remove('input-error'); 
            plan.push({ nom: b.querySelector('.titre').value, recette: sel.value, couverts: parseInt(couv.value) || 1 }); 
          }
        });
        
        let msgBox = document.getElementById('msg_erreur');
        if(err) { msgBox.classList.remove('hidden'); return; } else { msgBox.classList.add('hidden'); }
        
        changerVue('etape3');
        document.getElementById('conteneur_rayons').innerHTML = '<p class="p-4 text-center text-slate-500 animate-pulse text-sm">Calcul et sauvegarde du menu...</p>';
        
        const dateDebutStr = document.getElementById('date_debut_menu').value;
        const idMenuExistant = document.getElementById('edit_menu_id').value;

        apiPost('sauvegarderMenu', { plan: plan, dateDebutStr: dateDebutStr, idMenuExistant: idMenuExistant });

        try {
          listeCoursesBrute = await apiPost('calculerCourses', { planification: plan }) || [];
          afficherListeCourseTriee();
        } catch(e) {
          document.getElementById('conteneur_rayons').innerHTML = '<p class="p-4 text-center text-red-500 text-sm">Erreur lors du calcul.</p>';
        }
      }

      // --- RENDU DE LA LISTE DE COURSES GROUPÉE PAR RAYON ---
      function afficherListeCourseTriee() {
        let conteneur = document.getElementById('conteneur_rayons');
        
        if (!listeCoursesBrute || listeCoursesBrute.length === 0) {
          conteneur.innerHTML = '<p class="p-4 text-center text-slate-500 text-sm bg-white rounded-2xl shadow-sm">Aucun ingrédient trouvé.</p>';
          return;
        }

        // Groupement par rayon
        let groupes = {};
        listeCoursesBrute.forEach(item => {
          let rayon = determinerRayon(item.nom);
          if (!groupes[rayon]) groupes[rayon] = [];
          groupes[rayon].push(item);
        });

        let html = '';
        for (let [rayon, items] of Object.entries(groupes)) {
          html += `
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
              <div class="bg-slate-100/80 px-3 py-2 font-bold text-slate-700 text-xs uppercase tracking-wider border-b border-slate-200">
                ${rayon}
              </div>
              <ul class="divide-y divide-slate-100">`;
          
          items.forEach(item => {
            let qteAffichee = item.quantite > 0 ? item.quantite : "";
            html += `
              <li class="flex items-center justify-between p-3 hover:bg-slate-50 transition-colors w-full">
                <div class="flex-grow pr-2 min-w-0">
                  <span class="font-bold text-slate-800 text-sm break-words">${item.nom}</span> 
                  <span class="text-blue-600 font-semibold ml-1 text-sm whitespace-nowrap">${qteAffichee} ${item.unite}</span>
                </div>
                <button type="button" class="delete min-w-[36px] min-h-[36px] w-9 flex items-center justify-center bg-red-100 text-red-600 rounded-lg active:scale-90 transition-all text-sm" onclick="supprimerIngredientListe(this, '${item.nom}')">🗑️</button>
              </li>`;
          });

          html += `</ul></div>`;
        }

        conteneur.innerHTML = html;
      }

      function supprimerIngredientListe(btn, nomIngredient) {
        btn.closest('li').remove();
        listeCoursesBrute = listeCoursesBrute.filter(i => i.nom !== nomIngredient);
      }

      function ajouterIngredient() {
        let input = document.getElementById('ajout_manuel');
        let valeur = input.value.trim();
        if(valeur !== "") {
          listeCoursesBrute.push({ nom: valeur, quantite: "", unite: "" });
          afficherListeCourseTriee();
          input.value = ""; 
        }
      }
      
      // --- PARTAGE DYNAMIQUE AVEC ENTÊTE DE DATE ---
      function partage(type) {
        let dateInput = document.getElementById('date_debut_menu').value;
        let dateFormatee = dateInput ? new Date(dateInput).toLocaleDateString('fr-FR') : "la semaine";

        let txt = "";

        if (type === 'Menu') {
          txt = `🍽️ MENUS POUR LA SEMAINE DU ${dateFormatee} :\n\n`;
          plan.forEach(p => txt += `🗓️ ${p.nom}\n👉 ${p.recette} (${p.couverts} parts)\n\n`);
        } else {
          txt = `🛒 LISTE DE COURSES POUR LA SEMAINE DU ${dateFormatee} :\n\n`;
          
          // Reconstitution du texte groupé par rayon
          let groupes = {};
          listeCoursesBrute.forEach(item => {
            let rayon = determinerRayon(item.nom);
            if (!groupes[rayon]) groupes[rayon] = [];
            groupes[rayon].push(item);
          });

          for (let [rayon, items] of Object.entries(groupes)) {
            txt += `--- ${rayon.toUpperCase()} ---\n`;
            items.forEach(item => {
              let qte = item.quantite ? ` (${item.quantite} ${item.unite})` : '';
              txt += `- ${item.nom}${qte}\n`;
            });
            txt += `\n`;
          }
        }

        if (navigator.share) {
          navigator.share({ title: "Chef Perso", text: txt });
        } else {
          navigator.clipboard.writeText(txt).then(() => alert("Copié dans le presse-papier !"));
        }
      }

      async function afficherDetails() {
        let r = document.getElementById('select_consult').value;
        let p = parseInt(document.getElementById('parts_consult_val').innerText) || 5;
        if(!r) return;
        
        localStorage.setItem('derniere_recette', r);
        localStorage.setItem('derniers_couverts', p);

        document.getElementById('details_recette').innerHTML = '<p class="p-4 text-center text-slate-500 font-bold animate-pulse">Calcul...</p>';
        
        try {
          const items = await apiGet('getDetailsRecette', { nomRecette: r, nbParts: p });
          if (!items || items.length === 0) return document.getElementById('details_recette').innerHTML = '<p class="p-4 text-center">Introuvable.</p>';
          let h = '<ul class="divide-y divide-slate-100">';
          items.forEach(it => h += `<li class="p-3 flex justify-between bg-white"><span class="font-bold text-slate-800 text-sm">${it.nom}</span><span class="text-emerald-600 font-semibold text-sm">${it.quantite > 0 ? it.quantite : ""} ${it.unite}</span></li>`);
          document.getElementById('details_recette').innerHTML = h + '</ul>';
        } catch(e) {
          document.getElementById('details_recette').innerHTML = '<p class="p-4 text-center text-red-500">Erreur lors du chargement.</p>';
        }
      }

      function addIngRow() {
        let div = document.createElement('div');
        div.className = "flex gap-2 items-center bg-white p-2 rounded-xl border border-orange-200";
        div.innerHTML = `<input type="text" placeholder="Ingrédient" class="ing-nom flex-grow h-10 border-b outline-none text-sm"><input type="text" placeholder="Qté" class="ing-qte w-20 h-10 border-b outline-none text-sm text-center"><button type="button" onclick="this.parentElement.remove()" class="min-w-[40px] h-10 text-red-500">🗑️</button>`;
        document.getElementById('new_ingredients_list').appendChild(div);
      }

      async function sauverRecette() {
        let nom = document.getElementById('new_nom').value.trim();
        let ings = [];
        document.querySelectorAll('#new_ingredients_list > div').forEach(l => {
          let n = l.querySelector('.ing-nom').value.trim();
          if(n) ings.push({nom: n, qte: l.querySelector('.ing-qte').value.trim()});
        });
        if(!nom || ings.length === 0) return alert("⚠️ Nom et ingrédients requis.");
        
        let btn = document.getElementById('btn_save');
        btn.innerText = "⏳ Enregistrement..."; btn.disabled = true;

        try {
          const msg = await apiPost('enregistrerRecette', { nom, ingredients: ings });
          alert(msg);
          location.reload();
        } catch(e) {
          alert("Erreur lors de l'enregistrement.");
          btn.innerText = "💾 Enregistrer la recette"; btn.disabled = false;
        }
      }
    </script>
  </body>
</html>
